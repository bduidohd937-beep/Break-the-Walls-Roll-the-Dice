name: Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/**"
      - ".github/workflows/browser-e2e.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install main project
        run: npm ci
      - name: Verify existing checks
        run: npm run check
      - name: Install isolated browser-test dependencies
        run: npm install --prefix e2e --no-package-lock
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
